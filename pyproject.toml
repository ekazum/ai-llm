[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-llm"
version = "0.1.0"
description = "LLM generation service for ML pipelines: GPU batching, sockets, clients and stats"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "transformers",
    "ai-runtime[config] @ git+https://github.com/ekazum/ai-runtime.git@v0.3.0",
]
authors = [{ name = "Eli Kazum", email = "ekazum@gmail.com" }]
keywords = ["machine-learning", "llm", "vllm", "inference", "batching", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
vllm = ["vllm"]

[project.urls]
Homepage = "https://github.com/ekazum/ai-llm"
Repository = "https://github.com/ekazum/ai-llm"
Issues = "https://github.com/ekazum/ai-llm/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_llm*"]

[tool.setuptools.package-data]
ai_llm = ["*.sql"]
